<style>

.app { display:flex; gap:0; min-height:100vh; background:var(--color-background-primary); }
.sidebar { width:316px; min-width:316px; border-right:1px solid var(--color-border-tertiary); display:flex; flex-direction:column; overflow-y:auto; max-height:100vh; background:var(--color-background-elevated); }
.section { border-bottom:1px solid var(--color-border-tertiary); padding:16px 18px; }

.param-row select { font-size:12px; padding:6px 8px; border-radius:var(--border-radius-md); border:1px solid var(--color-border-secondary); background:var(--color-background-primary); color:var(--color-text-primary); flex:1; min-width:0; }

<script>
const photos = [];
let currentMode = 'radial';

const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const photoList = document.getElementById('photoList');
const renderBtn = document.getElementById('renderBtn');
const downloadBtn = document.getElementById('downloadBtn');
const canvas = document.getElementById('previewCanvas');
const emptyState = document.getElementById('emptyState');
const statusBar = document.getElementById('statusBar');
const ctx = canvas.getContext('2d');

function setStatus(msg) { statusBar.textContent = msg; }

function slider(id, suffix) {
  const el = document.getElementById(id);
  const out = document.getElementById(id + 'Val');
  if (!el || !out) return;
  const update = () => {
    const v = parseFloat(el.value);
    if (suffix === 'clock') out.textContent = clockLabel(v);
    else out.textContent = Math.round(v) + suffix;
  };
  el.addEventListener('input', update);
  update();
}
function clockLabel(d) {
  if (d === 270) return '12点';
  if (d === 0 || d === 360) return '3点';
  if (d === 90) return '6点';
  if (d === 180) return '9点';
  return Math.round(d) + '°';
}
slider('coverAngle','°'); slider('startAngle','clock');
slider('innerRadius','%'); slider('outerRadius','%');
slider('sampleX','%'); slider('sampleY','%'); slider('featherR','°');
slider('dividerWidthR','px');
slider('sampleOffsetL','%'); slider('featherL','px'); slider('dividerWidthL','px');

function mkToggle(id, cb) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('click', () => { btn.classList.toggle('on'); if (cb) cb(btn.classList.contains('on')); });
}
mkToggle('toggleDividerR', on => { document.getElementById('dividerRowR').style.display = on ? 'flex':'none'; });
mkToggle('toggleMaskR');
mkToggle('toggleLabelR');
mkToggle('toggleDividerL', on => { document.getElementById('dividerRowL').style.display = on ? 'flex':'none'; });
mkToggle('toggleLabelL');

document.getElementById('tabRadial').addEventListener('click', () => switchMode('radial'));
document.getElementById('tabLinear').addEventListener('click', () => switchMode('linear'));

function switchMode(m) {
  currentMode = m;
  document.getElementById('tabRadial').classList.toggle('active', m==='radial');
  document.getElementById('tabLinear').classList.toggle('active', m==='linear');
  document.getElementById('tabRadial').setAttribute('aria-pressed', m==='radial');
  document.getElementById('tabLinear').setAttribute('aria-pressed', m==='linear');
  document.getElementById('panelRadial').classList.toggle('visible', m==='radial');
  document.getElementById('panelLinear').classList.toggle('visible', m==='linear');
  if (!downloadBtn.disabled) setStatus('切换模式后请重新渲染');
}

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.background='var(--color-background-secondary)'; });
uploadZone.addEventListener('dragleave', () => uploadZone.style.background='');
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.style.background='';
  handleFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
});
fileInput.addEventListener('change', () => { handleFiles(Array.from(fileInput.files)); fileInput.value=''; });

function handleFiles(files) {
  files.sort((a,b) => compareName(a.name, b.name));
  let loaded = 0;
  files.forEach(file => {
    const img = new Image();
    img.onload = () => {
      photos.push({ img, name: file.name });
      loaded++;
      if (loaded === files.length) { renderPhotoList(); renderBtn.disabled = false; setStatus(`已加载 ${photos.length} 张照片`); }
    };
    img.src = URL.createObjectURL(file);
  });
}

function renderPhotoList() {
  photoList.innerHTML = '';
  photos.forEach((p,i) => {
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `<span class="idx">${i+1}</span><span class="name">${p.name}</span><button class="del" data-i="${i}" aria-label="删除"><i class="ti ti-x"></i></button>`;
    div.querySelector('.del').addEventListener('click', () => {
      photos.splice(i, 1); renderPhotoList();
      if (!photos.length) { renderBtn.disabled = true; downloadBtn.disabled = true; }
      setStatus(`剩余 ${photos.length} 张照片`);
    });
    photoList.appendChild(div);
  });
}

renderBtn.addEventListener('click', () => { if (photos.length) doRender(); });

function doRender() {
  setStatus('渲染中…'); renderBtn.disabled = true;
  setTimeout(() => {
    if (currentMode === 'radial') renderRadialMode();
    else renderLinearMode();
    renderBtn.disabled = false;
    downloadBtn.disabled = false;
  }, 30);
}

function hexRgb(hex) {
  return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
}

function compareName(a, b) {
  return a.localeCompare(b, undefined, { numeric:true, sensitivity:'base' });
}

function parseSizeValue(value) {
  const parts = String(value).split('x').map(v => parseInt(v, 10));
  if (parts.length === 2 && parts.every(Number.isFinite)) return { W:parts[0], H:parts[1] };
  const sz = parseInt(value, 10);
  return { W:sz, H:sz };
}

function normalizeAngle(rad) {
  const tau = Math.PI * 2;
  rad %= tau;
  return rad < 0 ? rad + tau : rad;
}

function smooth01(t) {
  const v = Math.max(0, Math.min(1, t));
  return v * v * (3 - 2 * v);
}

function mixColor(a, b, t) {
  return {
    r:a.r + (b.r - a.r) * t,
    g:a.g + (b.g - a.g) * t,
    b:a.b + (b.b - a.b) * t
  };
}

function buildImageBuffers(list) {
  return list.map(ph => {
    const oc = document.createElement('canvas');
    oc.width = ph.img.naturalWidth;
    oc.height = ph.img.naturalHeight;
    const c2 = oc.getContext('2d');
    c2.drawImage(ph.img, 0, 0);
    return { d:c2.getImageData(0, 0, oc.width, oc.height).data, w:oc.width, h:oc.height };
  });
}

function centerWeightedOrder(list, centerIndex) {
  const source = list.map((item, index) => ({ item, index }));
  const center = source.findIndex(entry => entry.index === centerIndex);
  const orderedFromCenter = [
    source[center],
    ...source.slice(0, center).reverse(),
    ...source.slice(center + 1)
  ].filter(Boolean);
  const result = new Array(list.length);
  const mid = Math.floor((list.length - 1) / 2);
  const positions = [mid];
  for (let step = 1; positions.length < list.length; step++) {
    if (mid + step < list.length) positions.push(mid + step);
    if (mid - step >= 0) positions.push(mid - step);
  }
  orderedFromCenter.forEach((entry, i) => { result[positions[i]] = entry.item; });
  return result;
}

function sortPhotos(order) {
  const current = [...photos];
  const byName = [...photos].sort((a, b) => compareName(a.name, b.name));
  if (order === 'name-desc') return [...byName].reverse();
  if (order === 'list') return current;
  if (order === 'list-reverse' || order === 'reverse') return current.reverse();
  if (order === 'latest-center' || order === 'center-out') return centerWeightedOrder(byName, byName.length - 1);
  if (order === 'earliest-center') return centerWeightedOrder(byName, 0);
  return byName;
}

function coverSample(buffer, x, y, W, H) {
  const scale = Math.max(W / buffer.w, H / buffer.h);
  const drawW = buffer.w * scale;
  const drawH = buffer.h * scale;
  const sx = Math.max(0, Math.min(Math.round((x - (W - drawW) / 2) / scale), buffer.w - 1));
  const sy = Math.max(0, Math.min(Math.round((y - (H - drawH) / 2) / scale), buffer.h - 1));
  const p = (sy * buffer.w + sx) * 4;
  return { r:buffer.d[p], g:buffer.d[p + 1], b:buffer.d[p + 2] };
}

function sampleBuffer(buffer, sx, sy, fallback) {
  if (sx < 0 || sy < 0 || sx > buffer.w - 1 || sy > buffer.h - 1) return fallback;
  const x0 = Math.floor(sx);
  const y0 = Math.floor(sy);
  const x1 = Math.min(x0 + 1, buffer.w - 1);
  const y1 = Math.min(y0 + 1, buffer.h - 1);
  const tx = sx - x0;
  const ty = sy - y0;
  const p00 = (y0 * buffer.w + x0) * 4;
  const p10 = (y0 * buffer.w + x1) * 4;
  const p01 = (y1 * buffer.w + x0) * 4;
  const p11 = (y1 * buffer.w + x1) * 4;
  const top = {
    r:buffer.d[p00] + (buffer.d[p10] - buffer.d[p00]) * tx,
    g:buffer.d[p00 + 1] + (buffer.d[p10 + 1] - buffer.d[p00 + 1]) * tx,
    b:buffer.d[p00 + 2] + (buffer.d[p10 + 2] - buffer.d[p00 + 2]) * tx
  };
  const bottom = {
    r:buffer.d[p01] + (buffer.d[p11] - buffer.d[p01]) * tx,
    g:buffer.d[p01 + 1] + (buffer.d[p11 + 1] - buffer.d[p01 + 1]) * tx,
    b:buffer.d[p01 + 2] + (buffer.d[p11 + 2] - buffer.d[p01 + 2]) * tx
  };
  return mixColor(top, bottom, ty);
}

function rayLimitToRect(cx, cy, angle, W, H) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const limits = [];
  if (cos > 1e-6) limits.push((W - 1 - cx) / cos);
  else if (cos < -1e-6) limits.push((0 - cx) / cos);
  if (sin > 1e-6) limits.push((H - 1 - cy) / sin);
  else if (sin < -1e-6) limits.push((0 - cy) / sin);
  return Math.max(0, Math.min(...limits.filter(v => v >= 0)));
}

function polarSample(buffer, angle, radiusT, centerX, centerY, fallback) {
  const sx0 = (buffer.w - 1) * centerX;
  const sy0 = (buffer.h - 1) * centerY;
  const limit = rayLimitToRect(sx0, sy0, angle, buffer.w, buffer.h);
  const radius = limit * Math.max(0, Math.min(1, radiusT));
  return sampleBuffer(
    buffer,
    sx0 + Math.cos(angle) * radius,
    sy0 + Math.sin(angle) * radius,
    fallback
  );
}

function renderRadialMode() {
  const n = photos.length;
  const sortOrder = document.getElementById('sortOrderR').value;
  const sortedPhotos = sortPhotos(sortOrder);
  const { W, H } = parseSizeValue(document.getElementById('sizeSelectR').value);
  const mode = document.getElementById('modeSelectR').value;
  const coverAngle = parseFloat(document.getElementById('coverAngle').value);
  const startDeg   = parseFloat(document.getElementById('startAngle').value);
  const innerR     = parseFloat(document.getElementById('innerRadius').value) / 100;
  const outerR     = parseFloat(document.getElementById('outerRadius').value) / 100;
  const centerX    = parseFloat(document.getElementById('sampleX').value) / 100;
  const centerY    = parseFloat(document.getElementById('sampleY').value) / 100;
  const featherDeg = parseFloat(document.getElementById('featherR').value);
  const showDiv    = document.getElementById('toggleDividerR').classList.contains('on');
  const divColor   = document.getElementById('dividerColorR').value;
  const divW       = parseInt(document.getElementById('dividerWidthR').value);
  const useMask    = document.getElementById('toggleMaskR').classList.contains('on');
  const bgColor    = document.getElementById('bgColorR').value;
  const showLabel  = document.getElementById('toggleLabelR').classList.contains('on');

  const MAX_PREVIEW_W = 900;
  const MAX_PREVIEW_H = 620;
  const displayScale = Math.min(1, MAX_PREVIEW_W / W, MAX_PREVIEW_H / H);
  canvas.width = W; canvas.height = H;
  canvas.style.width = Math.round(W * displayScale) + 'px';
  canvas.style.height = Math.round(H * displayScale) + 'px';

  const cx = W * centerX;
  const cy = H * centerY;
  const rayR = Math.max(
    Math.hypot(cx, cy),
    Math.hypot(W - cx, cy),
    Math.hypot(cx, H - cy),
    Math.hypot(W - cx, H - cy)
  );
  const circleR = Math.min(W, H) * 0.5 * outerR;
  const maxR = useMask ? circleR : rayR * outerR;
  const minR = maxR * innerR;
  const startRad = startDeg * Math.PI / 180;
  const coverRad = coverAngle * Math.PI / 180;
  const sliceRad = coverRad / n;
  const featherRad = Math.min(featherDeg * Math.PI / 180, sliceRad * 0.45);
  const fullCircle = coverAngle >= 359.999;
  const useRadialBounds = useMask || innerR > 0 || outerR < 0.999;
  const bg = hexRgb(bgColor);
  const buffers = buildImageBuffers(sortedPhotos);

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);

  if (mode === 'fan') {
    const idata = ctx.getImageData(0,0,W,H);
    const data = idata.data;
    for (let y=0; y<H; y++) {
      for (let x=0; x<W; x++) {
        const dx=x-cx, dy=y-cy;
        const r = Math.sqrt(dx*dx+dy*dy);
        if (useRadialBounds && (r<minR || r>maxR)) continue;
        const angle = normalizeAngle(Math.atan2(dy,dx) - startRad);
        if (!fullCircle && angle>coverRad) continue;
        const si = Math.min(Math.floor(angle/sliceRad), n-1);
        const localA = angle - si*sliceRad;
        let color = coverSample(buffers[si], x, y, W, H);

        if (featherRad > 0) {
          const leftDist = localA;
          const rightDist = sliceRad - localA;
          if (leftDist < featherRad) {
            const ni = si > 0 ? si - 1 : (fullCircle ? n - 1 : -1);
            const nextColor = ni >= 0 ? coverSample(buffers[ni], x, y, W, H) : bg;
            color = mixColor(nextColor, color, smooth01(leftDist / featherRad));
          } else if (rightDist < featherRad) {
            const ni = si < n - 1 ? si + 1 : (fullCircle ? 0 : -1);
            const nextColor = ni >= 0 ? coverSample(buffers[ni], x, y, W, H) : bg;
            color = mixColor(nextColor, color, smooth01(rightDist / featherRad));
          }
        }

        const pi2 = (y*W+x)*4;
        data[pi2]   = Math.round(color.r);
        data[pi2+1] = Math.round(color.g);
        data[pi2+2] = Math.round(color.b);
        data[pi2+3] = 255;
      }
    }
    ctx.putImageData(idata, 0, 0);
  } else {
    const idata = ctx.getImageData(0,0,W,H);
    const data = idata.data;
    for (let y=0; y<H; y++) {
      for (let x=0; x<W; x++) {
        const dx=x-cx, dy=y-cy;
        const r = Math.sqrt(dx*dx+dy*dy);
        if (useRadialBounds && (r<minR || r>maxR)) continue;
        const angle = normalizeAngle(Math.atan2(dy,dx) - startRad);
        if (!fullCircle && angle>coverRad) continue;
        const si = Math.min(Math.floor(angle/sliceRad), n-1);
        const t = maxR === minR ? 0 : (r - minR) / (maxR - minR);
        const sourceAngle = startRad + angle;
        let color = polarSample(buffers[si], sourceAngle, t, centerX, centerY, bg);

        if (featherRad > 0) {
          const localA = angle - si*sliceRad;
          const leftDist = localA;
          const rightDist = sliceRad - localA;
          if (leftDist < featherRad) {
            const ni = si > 0 ? si - 1 : (fullCircle ? n - 1 : -1);
            const nextColor = ni >= 0 ? polarSample(buffers[ni], sourceAngle, t, centerX, centerY, bg) : bg;
            color = mixColor(nextColor, color, smooth01(leftDist / featherRad));
          } else if (rightDist < featherRad) {
            const ni = si < n - 1 ? si + 1 : (fullCircle ? 0 : -1);
            const nextColor = ni >= 0 ? polarSample(buffers[ni], sourceAngle, t, centerX, centerY, bg) : bg;
            color = mixColor(nextColor, color, smooth01(rightDist / featherRad));
          }
        }

        const pi2 = (y*W+x)*4;
        data[pi2]   = Math.round(color.r);
        data[pi2+1] = Math.round(color.g);
        data[pi2+2] = Math.round(color.b);
        data[pi2+3] = 255;
      }
    }
    ctx.putImageData(idata, 0, 0);
  }

  if (showDiv) {
    ctx.strokeStyle=divColor; ctx.lineWidth=divW;
    for (let i=0; i<=n; i++) {
      const a=startRad+i*sliceRad;
      ctx.beginPath(); ctx.moveTo(cx+minR*Math.cos(a),cy+minR*Math.sin(a)); ctx.lineTo(cx+maxR*Math.cos(a),cy+maxR*Math.sin(a)); ctx.stroke();
    }
  }
  if (showLabel) {
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const fs=Math.max(10,Math.round(Math.min(W,H)*0.016));
    ctx.font=`${fs}px sans-serif`;
    for (let i=0;i<n;i++) { const a=startRad+(i+0.5)*sliceRad; ctx.fillText(i+1,cx+(maxR+20)*Math.cos(a),cy+(maxR+20)*Math.sin(a)); }
  }
  emptyState.style.display='none'; canvas.style.display='block';
  const label = mode === 'fan' ? '扇形切片' : '极坐标重采样';
  setStatus(`✓ ${label}完成  ${W}×${H}px  共 ${n} 张`);
}

function renderLinearMode() {
  const n = photos.length;
  const W = parseInt(document.getElementById('widthSelectL').value);
  const H = parseInt(document.getElementById('heightSelectL').value);
  const isH = document.getElementById('directionL').value === 'h';
  const offset = parseFloat(document.getElementById('sampleOffsetL').value) / 100;
  const featherPx = parseInt(document.getElementById('featherL').value);
  const showDiv = document.getElementById('toggleDividerL').classList.contains('on');
  const divColor = document.getElementById('dividerColorL').value;
  const divW = parseInt(document.getElementById('dividerWidthL').value);
  const bgColor = document.getElementById('bgColorL').value;
  const showLabel = document.getElementById('toggleLabelL').classList.contains('on');
  const bg = hexRgb(bgColor);

  const sortOrder = document.getElementById('sortOrderL').value;
  const sortedPhotos = sortPhotos(sortOrder);

  const MAX_DISPLAY_W = 560;
  const displayW = Math.min(W, MAX_DISPLAY_W);
  const displayH = Math.round(displayW * H / W);
  canvas.width = W; canvas.height = H;
  canvas.style.width = displayW+'px'; canvas.style.height = displayH+'px';

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);

  const offs = buildImageBuffers(sortedPhotos);

  const idata = ctx.getImageData(0, 0, W, H);
  const data = idata.data;

  if (isH) {
    const stripW = W / n;
    for (let x = 0; x < W; x++) {
      const imgIdx = Math.min(Math.floor(x / stripW), n-1);
      const ph = offs[imgIdx];
      const posInStrip = x - imgIdx * stripW;

      const sliceStart = (imgIdx / n) * ph.w;
      const sliceEnd   = ((imgIdx + 1) / n) * ph.w;
      const sliceW = sliceEnd - sliceStart;
      const rawSrcX = sliceStart + (posInStrip / stripW) * sliceW + offset * ph.w;
      const srcX = Math.max(0, Math.min(Math.round(rawSrcX), ph.w-1));

      let alpha = 1;
      if (featherPx > 0) {
        const distEdge = Math.min(posInStrip, stripW - posInStrip);
        if (distEdge < featherPx) alpha = distEdge / featherPx;
      }

      for (let y = 0; y < H; y++) {
        const srcY = Math.max(0, Math.min(Math.round((y / H) * ph.h), ph.h-1));
        const s = (srcY * ph.w + srcX) * 4;
        const pi = (y * W + x) * 4;
        data[pi]   = Math.round(ph.d[s]   * alpha + bg.r * (1-alpha));
        data[pi+1] = Math.round(ph.d[s+1] * alpha + bg.g * (1-alpha));
        data[pi+2] = Math.round(ph.d[s+2] * alpha + bg.b * (1-alpha));
        data[pi+3] = 255;
      }
    }
  } else {
    const stripH = H / n;
    for (let y = 0; y < H; y++) {
      const imgIdx = Math.min(Math.floor(y / stripH), n-1);
      const ph = offs[imgIdx];
      const posInStrip = y - imgIdx * stripH;

      const sliceStart = (imgIdx / n) * ph.h;
      const sliceEnd   = ((imgIdx + 1) / n) * ph.h;
      const sliceH = sliceEnd - sliceStart;
      const rawSrcY = sliceStart + (posInStrip / stripH) * sliceH + offset * ph.h;
      const srcY = Math.max(0, Math.min(Math.round(rawSrcY), ph.h-1));

      let alpha = 1;
      if (featherPx > 0) {
        const distEdge = Math.min(posInStrip, stripH - posInStrip);
        if (distEdge < featherPx) alpha = distEdge / featherPx;
      }

      for (let x = 0; x < W; x++) {
        const srcX = Math.max(0, Math.min(Math.round((x / W) * ph.w), ph.w-1));
        const s = (srcY * ph.w + srcX) * 4;
        const pi = (y * W + x) * 4;
        data[pi]   = Math.round(ph.d[s]   * alpha + bg.r * (1-alpha));
        data[pi+1] = Math.round(ph.d[s+1] * alpha + bg.g * (1-alpha));
        data[pi+2] = Math.round(ph.d[s+2] * alpha + bg.b * (1-alpha));
        data[pi+3] = 255;
      }
    }
  }
  ctx.putImageData(idata, 0, 0);

  if (showDiv) {
    ctx.strokeStyle = divColor; ctx.lineWidth = divW;
    for (let i = 1; i < n; i++) {
      const pos = Math.round((i / n) * (isH ? W : H));
      ctx.beginPath();
      if (isH) { ctx.moveTo(pos, 0); ctx.lineTo(pos, H); }
      else      { ctx.moveTo(0, pos); ctx.lineTo(W, pos); }
      ctx.stroke();
    }
  }

  if (showLabel) {
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const fs = Math.max(10, Math.round(Math.min(W,H) * 0.018));
    ctx.font = `${fs}px sans-serif`;
    for (let i = 0; i < n; i++) {
      const pos = ((i+0.5) / n) * (isH ? W : H);
      if (isH) ctx.fillText(i+1, pos, 10);
      else { ctx.save(); ctx.translate(12, pos); ctx.rotate(-Math.PI/2); ctx.fillText(i+1, 0, 0); ctx.restore(); }
    }
  }

  emptyState.style.display='none'; canvas.style.display='block';
  setStatus(`✓ 横向切片完成  ${W}×${H}px  共 ${n} 张`);
}

downloadBtn.addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `time-slice-${currentMode}-${Date.now()}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
});
</script>
